<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-Merger · 管理登录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#263132;font-family:"Noto Serif SC","Songti SC",serif;background:linear-gradient(135deg,#dce2de,#f5f2e9 58%,#cbd4d0)}
.card{width:min(390px,calc(100vw - 32px));padding:42px 38px 36px;border:1px solid #c9c7bd;border-radius:4px;background:rgba(244,241,232,.96);box-shadow:12px 16px 40px rgba(38,49,50,.16);position:relative}.card:before{content:"";position:absolute;left:-7px;top:44px;width:5px;height:82px;background:#a94734}
h1{font-size:28px;margin:0 0 6px}p{margin:0 0 28px;color:#727977;font-size:13px}label{display:block;margin-top:16px;font-size:13px}input{width:100%;height:44px;margin-top:7px;padding:0 12px;border:1px solid #bbbdb7;border-radius:3px;background:#fbfaf5;font:16px inherit}button{width:100%;height:44px;margin-top:24px;border:0;border-radius:3px;background:#263132;color:white;font:15px inherit;cursor:pointer}.error{margin-top:18px;padding:10px;color:#842e23;background:#f0ddd7;border-left:3px solid #a94734}
</style></head>
<body><form class="card" method="post"><h1>Sub-Merger</h1><p>订阅聚合管理</p><label>管理密码<input name="password" type="password" autocomplete="current-password" required></label>{% if error %}<div class="error">{{ error }}</div>{% endif %}<button>进入后台</button></form></body></html>
